<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss animasyon vitrini</title>
<style>
body{margin:0;background:#0c1018;color:#d4dce6;font:14px monospace}header{position:sticky;top:0;z-index:1;background:#151b25;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;background:#253044;border:1px solid #475775;padding:7px 10px;cursor:pointer}button.on{background:#6d3e28;border-color:#d0884a}canvas{display:block;margin:12px auto;image-rendering:pixelated;max-width:100%;height:auto!important}label{white-space:nowrap}
</style>
</head><body>
<header>
<select id="type"><option value="all">Tüm bosslar</option></select>
<span id="modes"></span>
<label><input id="dark" type="checkbox">Mağara ışığı</label><label><input id="pause" type="checkbox">Durdur</label><label><input id="slow" type="checkbox">Ağır çekim</label>
</header><canvas id="c"></canvas>
<script type="module">
import {drawBossArt,drawBossArtGlow} from '/src/render/bossart.js';
import {drawBalrog,drawBalrogGlow} from '/src/render/balrog.js';
import {drawDragon,drawDragonGlow,drawHoardDragon,drawHoardGlow} from '/src/render/dragon.js';
import {drawSerpent,drawSerpentGlow} from '/src/render/serpent.js';
import {setG} from '/src/game/state.js';
import {ENEMIES,HOARD,SERPENT} from '/src/data/balance.js';
import {T} from '/src/data/tiles.js';
import {COLS,ROWS} from '/src/config.js';
import {makeBoss,getScene,stepScene,sceneNames} from '/scripts/boss-scenes.mjs';
const LABEL={idle:'Bekleme',walk:'Yürüyüş',turn:'Dönüş',hurt:'Vuruş',rage:'Öfke',die:'Ölüm',spawn:'Doğuş',attack:'Saldırılar',sleep:'Altında uyku',wake:'Uyanış'};
const types=Object.keys(ENEMIES).filter(k=>ENEMIES[k].boss);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),CELL=268,ROW=190,W=CELL*2,X0=134,Y0=160;
const G={time:0,player:null,players:[],enemies:[],map:new Uint8Array(COLS*ROWS).fill(T.AIR),lq:new Uint8Array(COLS*ROWS),lk:new Uint8Array(COLS*ROWS),cam:{y:0},ebullets:[],structures:[]};setG(G);
const ents=types.map((type,i)=>Object.assign(makeBoss(type,X0,ENEMIES[type].fly?Y0-35:Y0),{wob:i*0.47,clock:0,scene:'',pl:{x:220,y:145,dead:false,face:1}}));G.enemies=ents;
for(const type of types){const o=document.createElement('option');o.value=type;o.textContent=ENEMIES[type].name;document.getElementById('type').appendChild(o);}
let mode='idle',selected='all',last=performance.now(),lastFrame=0;
function modes(){const own=selected==='all'?[]:sceneNames(selected).filter(n=>!LABEL[n]);return ['idle','walk','turn','attack',...own,'hurt','rage','die','spawn',...(selected==='ejder'?['sleep','wake']:[])];}
function buttons(){const box=document.getElementById('modes');box.innerHTML='';for(const m of modes()){const b=document.createElement('button');b.textContent=LABEL[m]||m;b.dataset.m=m;b.classList.toggle('on',m===mode);b.onclick=()=>setMode(m);box.appendChild(b);}}
function setMode(m){mode=m;for(const e of ents)e.scene='';buttons();}
document.getElementById('type').onchange=ev=>{selected=ev.target.value;if(!modes().includes(mode))mode='idle';buttons();};
function glow(x,y,col,r,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=Math.max(0,Math.min(1,a*.5));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
// sahneyi varlığa uygular; biten sahne başa sarar ("Saldırılar": türün kendi saldırıları sırayla)
function state(e,dt){
  const p=e.pl;G.player=p;G.players=[p];G.hoard=null;
  if(e.type==='ejder'&&(mode==='sleep'||mode==='wake')){e.clock+=dt;G.hoard={st:mode==='sleep'?'sleep':'wake',t:e.clock%(HOARD.intro+.8),lv:mode==='sleep'?Math.floor(e.clock/6)%3:0,c:(X0-8)/16,r:(Y0-8)/16,r0:0,r1:-1,c0:0,c1:-1};return;}
  const own=sceneNames(e.type).filter(n=>!LABEL[n]);
  let name=mode==='attack'?own[e.round%Math.max(1,own.length)]||'idle':mode;
  let sc=getScene(e.type,name)||getScene(e.type,'idle');
  if(e.scene!==name){reset(e);e.scene=name;e.round=e.round||0;if(sc.setup)sc.setup(e,p);}
  const dur=sc.len?sc.len(e):sc.dur;
  e.clock+=dt;
  if(e.clock>dur+.6){e.round=(e.round||0)+1;e.scene='';return state(e,0);}
  stepScene(sc,e.clock,e,p,dt);
  if(e.type==='dunyaYilani'){e.bs.body=Array.from({length:SERPENT.n},(_,i)=>[e.x-i*3.8,e.y+Math.sin(i*.18-G.time*2)*13]);e.bs.sv={m:mode==='attack'?'rear':'run'};}
}
function reset(e){const f=makeBoss(e.type,X0,e.d.fly?Y0-35:Y0);for(const k of ['x','y','px','py','face','dead','dieT','emergeT','intro','hitT','wind','lunge','fade','sink','under','blinkT'])e[k]=f[k];e.bs={phase:1,act:null,marks:[],rings:[]};e.clock=-0.4;e.pl.x=e.x+86;e.pl.y=e.y-6;}
function body(e){if(G.hoard){drawHoardDragon(ctx);return;}if(e.type==='balrog')drawBalrog(ctx,e,1);else if(e.type==='ejder')drawDragon(ctx,e,1);else if(e.type==='dunyaYilani')drawSerpent(ctx,e,1);else drawBossArt(ctx,e,1);}
function light(e){if(G.hoard){drawHoardGlow(ctx,glow);return;}if(e.type==='balrog')drawBalrogGlow(ctx,e,1,glow);else if(e.type==='ejder')drawDragonGlow(ctx,e,1,glow);else if(e.type==='dunyaYilani')drawSerpentGlow(ctx,e,1,glow);else drawBossArtGlow(ctx,e,1,glow);}
function draw(dt){const visible=selected==='all'?ents:ents.filter(e=>e.type===selected),rows=Math.ceil(visible.length/2),height=rows*ROW+10;
if(cv.width!==W||cv.height!==height){cv.width=W;cv.height=height;cv.style.width=W*3+'px';ctx.imageSmoothingEnabled=false;}
ctx.fillStyle='#111720';ctx.fillRect(0,0,W,height);
visible.forEach((e,i)=>{ctx.save();ctx.translate(visible.length===1?CELL/2:i%2*CELL,Math.floor(i/2)*ROW);ctx.fillStyle='#242b33';ctx.fillRect(8,168,CELL-16,10);ctx.fillStyle='#45505b';ctx.fillRect(8,168,CELL-16,1);state(e,dt);
// madenci: hedefin yeri
ctx.fillStyle='#e8c060';ctx.fillRect(Math.round(e.pl.x)-2,Math.round(e.pl.y)-5,4,11);
body(e);if(document.getElementById('dark').checked){ctx.fillStyle='rgba(0,0,0,.56)';ctx.fillRect(0,0,CELL,ROW);}light(e);ctx.fillStyle='#c6d4e0';ctx.fillText(e.d.name+' · '+(e.scene||mode),12,16);ctx.restore();});
lastFrame++;}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(document.getElementById('slow').checked)dt*=.25;if(document.getElementById('pause').checked)dt=0;G.time+=dt;draw(dt);requestAnimationFrame(frame);}
buttons();requestAnimationFrame(frame);
window.preview={setMode,setType(t){selected=t;document.getElementById('type').value=t;buttons();},step(dt){G.time+=dt;draw(dt);},ents,G,get mode(){return mode;},get frames(){return lastFrame;}};
</script></body></html>
