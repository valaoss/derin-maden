<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss animasyon vitrini</title>
<style>
body{margin:0;background:#0c1018;color:#d4dce6;font:14px monospace}header{position:sticky;top:0;z-index:1;background:#151b25;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:inherit;background:#253044;border:1px solid #475775;padding:7px 10px;cursor:pointer}button.on{background:#6d3e28;border-color:#d0884a}canvas{display:block;margin:12px auto;image-rendering:pixelated;max-width:100%;height:auto!important}label{white-space:nowrap}
</style>
</head><body>
<header>
<select id="type"><option value="all">Tüm bosslar</option></select>
<button data-m="idle" class="on">Nefes / duruş</button><button data-m="walk">Yürüyüş</button><button data-m="rotate">360° dönüş</button><button data-m="attack">Saldırılar</button><button data-m="sword">Balrog kılıcı</button><button data-m="whip">Kamçı</button><button data-m="wings">Kanatlar</button><button data-m="breath">Ejder nefesi</button><button data-m="tail">Kuyruk</button><button data-m="sleep">Altında uyku</button><button data-m="wake">Uyanış</button><button data-m="hit">Vuruş</button><button data-m="rage">Öfke</button><button data-m="die">Ölüm</button>
<label><input id="dark" type="checkbox">Mağara ışığı</label><label><input id="pause" type="checkbox">Durdur</label>
</header><canvas id="c"></canvas>
<script type="module">
import {drawBossArt,drawBossArtGlow} from '/src/render/bossart.js';
import {boss3DStats} from '/src/render/boss3d.js';
import {drawBalrog,drawBalrogGlow} from '/src/render/balrog.js';
import {drawDragon,drawDragonGlow,drawHoardDragon,drawHoardGlow} from '/src/render/dragon.js';
import {drawSerpent,drawSerpentGlow} from '/src/render/serpent.js';
import {drawLiquids,drawLiquidGlow} from '/src/render/liquids.js';
import {setG} from '/src/game/state.js';
import {ENEMIES,HOARD,BALROG,SERPENT} from '/src/data/balance.js';
import {T} from '/src/data/tiles.js';
import {COLS,ROWS} from '/src/config.js';
const types=Object.keys(ENEMIES).filter(k=>ENEMIES[k].boss);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),CELL=268,ROW=178,W=CELL*2;
const p={x:220,y:145,dead:false};
const G={time:0,player:p,players:[p],enemies:[],map:new Uint8Array(COLS*ROWS).fill(T.AIR),lq:new Uint8Array(COLS*ROWS),lk:new Uint8Array(COLS*ROWS),cam:{y:0}};setG(G);
const ents=types.map(type=>({type,x:134,y:160,px:134,py:160,face:1,d:ENEMIES[type],anim:0,hitT:0,wind:0,lunge:0,dieT:0,dead:false,wob:types.indexOf(type)*0.47}));G.enemies=ents;
for(const type of types){const o=document.createElement('option');o.value=type;o.textContent=ENEMIES[type].name;document.getElementById('type').appendChild(o);}
for(let r=100;r<=112;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c;if(c===2||c===8||c===14||r===112)G.map[i]=T.STONE;if(r>=108&&r<112&&c>2&&c<14&&c!==8){G.lq[i]=r===108?6:8;G.lk[i]=c>8?1:0;}if(r>100&&r<108&&(c===4||c===12)){G.lq[i]=4;G.lk[i]=c===12?1:0;}}
let mode='idle',selected='all',elapsed=0,last=performance.now(),lastFrame=0;
function setMode(m){mode=m;elapsed=0;document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));document.getElementById('type').onchange=e=>{selected=e.target.value;};
function glow(x,y,col,r,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=Math.max(0,Math.min(1,a*.5));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
function state(e){
const c=elapsed%4,k=c/4;e.px=e.x;e.py=e.y;e.x=134;e.y=e.d.fly?125:160;e.py=e.y;e.face=1;e.anim=elapsed*7;e.dead=false;e.hitT=0;e.wind=0;e.lunge=0;e.intro=0;e.bs={phase:1};G.hoard=null;
p.x=e.x+90;p.y=e.y-8;
if(mode==='walk'){e.x+=Math.sin(elapsed*.9)*24;e.px=e.x-.38;e.face=Math.cos(elapsed*.9)>0?1:-1;p.x=e.x+e.face*90;}
if(mode==='rotate'){p.x=e.x+Math.cos(elapsed*.8)*95;p.y=e.y+Math.sin(elapsed*.8)*95;e.face=p.x>e.x?1:-1;}
if(mode==='hit')e.hitT=elapsed%.7<.12?.09:0;
if(mode==='rage')e.bs.phase=2;
if(mode==='die'){e.dead=true;e.dieT=Math.max(0,(e.d.dieT||.9)-(elapsed%((e.d.dieT||.9)+1)));}
let attack=['sword','whip','wings','breath','tail'].includes(mode)?mode:mode==='attack'?(e.type==='balrog'?['sword','whip','wings'][Math.floor(elapsed/4)%3]:e.type==='ejder'?['breath','tail','gust','soar'][Math.floor(elapsed/4)%4]:'cast'):null;
if(attack){const A={k:attack,T:Math.max(0,2.2-c),stage:'wind',st:.6-c,done:c>.9,fire:c>1&&c<2.8,a:0,len:100};e.wind=Math.min(1,c/.9);e.lunge=c>1&&c<1.5?1-(c-1)/.5:0;
if(attack==='sword'){A.stage=c<.8?'raise':'fall';A.st=c<.8?.8-c:Math.max(0,1.5-c);}
if(attack==='whip'){A.stage=c<.6?'wind':c<.96?'lash':'rest';A.st=c<.6?.6-c:c<.96?.96-c:.35;}
if(attack==='breath'){A.stage=c<1.1?'glow':c<2.7?'fire':'rest';A.st=c<1.1?1.1-c:2.7-c;A.a=.35*Math.sin(elapsed);e.wind=c<1.1?c/1.1:0;}
if(attack==='tail'){A.T=.9-c%1.2;A.done=A.T<.4;}
if(attack==='gust'){A.T=1.3-c%2;A.done=A.T<.7;}
if(attack==='soar'){A.stage=c<.9?'up':c<3.3?'hover':'dive';}
e.bs.act=A;}
if(e.type==='dunyaYilani'){e.bs.body=Array.from({length:SERPENT.n},(_,i)=>[e.x-i*3.8,e.y+Math.sin(i*.18-elapsed*2)*13]);e.bs.sv={m:attack?'rear':'run'};}
if(e.type==='ejder'&&(mode==='sleep'||mode==='wake'))G.hoard={st:mode==='sleep'?'sleep':'wake',t:elapsed%(HOARD.intro+.8),lv:mode==='sleep'?Math.floor(elapsed/6)%3:0,c:(e.x-8)/16,r:(e.y-8)/16,r0:0,r1:-1,c0:0,c1:-1};
}
function body(e){if(G.hoard){drawHoardDragon(ctx);return;}if(e.type==='balrog')drawBalrog(ctx,e,1);else if(e.type==='ejder')drawDragon(ctx,e,1);else if(e.type==='dunyaYilani')drawSerpent(ctx,e,1);else drawBossArt(ctx,e,1);}
function light(e){if(G.hoard){drawHoardGlow(ctx,glow);return;}if(e.type==='balrog')drawBalrogGlow(ctx,e,1,glow);else if(e.type==='ejder')drawDragonGlow(ctx,e,1,glow);else if(e.type==='dunyaYilani')drawSerpentGlow(ctx,e,1,glow);else drawBossArtGlow(ctx,e,1,glow);}
function draw(){const visible=selected==='all'?ents:ents.filter(e=>e.type===selected),rows=Math.ceil(visible.length/2),height=rows*ROW+230;
if(cv.width!==W||cv.height!==height){cv.width=W;cv.height=height;cv.style.width=W*2+'px';ctx.imageSmoothingEnabled=false;}
ctx.fillStyle='#111720';ctx.fillRect(0,0,W,height);
visible.forEach((e,i)=>{ctx.save();ctx.translate(visible.length===1?CELL/2:i%2*CELL,Math.floor(i/2)*ROW);ctx.fillStyle='#242b33';ctx.fillRect(8,168,CELL-16,10);ctx.fillStyle='#45505b';ctx.fillRect(8,168,CELL-16,1);state(e);body(e);if(document.getElementById('dark').checked){ctx.fillStyle='rgba(0,0,0,.56)';ctx.fillRect(0,0,CELL,ROW);}light(e);ctx.fillStyle='#c6d4e0';ctx.fillText(e.d.name,12,16);ctx.restore();});
const bottom=rows*ROW;ctx.fillStyle='#b8cde0';ctx.fillText('SU  ·  sürekli akış / köpük / kırılan ışık',12,bottom+20);ctx.fillText('LAV  ·  akıntı / kabuk / kabarcık',12,bottom+38);ctx.save();ctx.translate((W-272)/2,bottom+52-1600);drawLiquids(ctx,100,112);drawLiquidGlow(ctx,100,112,glow);ctx.restore();lastFrame++;}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.getElementById('pause').checked){elapsed+=dt;G.time+=dt;}draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.preview={setMode,setType(t){selected=t;document.getElementById('type').value=t;},seek(t){elapsed=t;G.time=t;draw();},draw,ents,G,boss3DStats,get mode(){return mode;},get frames(){return lastFrame;}};
</script></body></html>
